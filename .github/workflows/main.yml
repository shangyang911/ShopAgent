name: Deploy to ECS
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shopagent-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Test, back up, deploy and verify the exact commit
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/shopagent-key"
          hosts="$RUNNER_TEMP/shopagent-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          ssh-keygen -y -f "$key" > /dev/null
          printf '%s\n' '123.57.2.244 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINcU73Vh7CaDADMRR0hEfmq6kD/9LEYD/Ct5a+pn3Cs5' > "$hosts"
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -o ServerAliveInterval=30 -o ServerAliveCountMax=10 shopagent-deploy@123.57.2.244 "/usr/local/sbin/shopagent-release $REVISION"
      - name: Verify public readiness
        run: curl --fail --retry 3 --max-time 15 https://123.57.2.244/api/ready
