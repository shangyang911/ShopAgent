version: '1.0'
name: shopagent-production
displayName: ShopAgent 测试与自动发布
triggers:
  push:
    branches:
      precise:
        - master
stages:
  - stage:
    name: validated-release
    displayName: 隔离测试、备份、发布与验收
    strategy: naturally
    trigger: auto
    steps:
      - step: shell@agent
        name: release-shopagent
        displayName: 发布指定提交，失败自动恢复
        schedulerType: DISTRIBUTED
        scriptType: SH
        gitClone: "true"
        hostGroupID:
          ID: shopagent-production
          hostID:
            - 3a727763-e214-4592-9aa3-54a025eb00d7
        script: |
          set -eu
          sudo -n /usr/local/sbin/shopagent-release "${GITEE_COMMIT}"
