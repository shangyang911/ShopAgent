name: shopagent
services:
  db:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shopagent
      MYSQL_USER: shopagent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--innodb-buffer-pool-size=512M"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  api:
    image: shopagent-api:${SHOPAGENT_RELEASE:?Set SHOPAGENT_RELEASE}
    pull_policy: never
    restart: unless-stopped
    env_file: /opt/shopagent/secrets/backend.env
    volumes:
      - /opt/shopagent/data/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/ready', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 45s
    logging: *logging
  web:
    image: shopagent-web:${SHOPAGENT_RELEASE:?Set SHOPAGENT_RELEASE}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - /opt/shopagent/secrets/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 8s
      retries: 10
    logging: *logging
volumes:
  mysql_data:
    name: shopagent_mysql_data
